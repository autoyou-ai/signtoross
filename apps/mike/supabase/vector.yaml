api:
  enabled: true
  address: 0.0.0.0:9001

sources:
  docker_host:
    type: docker_logs
    exclude_containers:
      - "supabase_vector_mike"

transforms:
  project_logs:
    type: remap
    inputs:
      - docker_host
    source: |-
      .project = "mike"
      .event_message = del(.message)
      .appname = del(.container_name)
      del(.container_created_at)
      del(.container_id)
      del(.source_type)
      del(.stream)
      del(.label)
      del(.image)
      del(.host)

sinks:
  console:
    type: console
    inputs:
      - project_logs
    encoding:
      codec: json
