name: signtoross-mike

x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  db:
    <<: *service
    image: supabase/postgres:17.6.1.136
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run configure.py first}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET:?Run configure.py first}
      JWT_EXP: "3600"
    volumes:
      - database:/var/lib/postgresql/data
      - database-config:/etc/postgresql-custom
      - ./db-roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-mike-roles.sql:ro
    command: [postgres, -c, config_file=/etc/postgresql/postgresql.conf, -c, log_min_messages=warning]
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -h, localhost]
      interval: 5s
      timeout: 5s
      retries: 30

  auth:
    <<: *service
    image: supabase/gotrue:v2.196.0
    depends_on:
      db: {condition: service_healthy}
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${PUBLIC_URL:?Set PUBLIC_URL}/supabase/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${PUBLIC_URL}
      GOTRUE_URI_ALLOW_LIST: ${PUBLIC_URL}/**
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${PUBLIC_URL}/supabase/auth/v1
      GOTRUE_PASSWORD_MIN_LENGTH: "12"
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
    healthcheck:
      test: [CMD, wget, --spider, -q, http://127.0.0.1:9999/health]
      interval: 10s
      timeout: 5s
      retries: 20

  rest:
    <<: *service
    image: postgrest/postgrest:v14.17
    depends_on:
      db: {condition: service_healthy}
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_ADMIN_SERVER_PORT: "3001"
      PGRST_ADMIN_SERVER_HOST: localhost
    healthcheck:
      test: [CMD, postgrest, --ready]
      interval: 10s
      timeout: 5s
      retries: 20

  storage:
    <<: *service
    image: supabase/storage-api:v1.74.0
    depends_on:
      db: {condition: service_healthy}
      rest: {condition: service_healthy}
    environment:
      ANON_KEY: ${ANON_KEY:?Run configure.py first}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:?Run configure.py first}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      # Preserve each request's Host for SigV4. A fixed STORAGE_PUBLIC_URL
      # would make private-network S3 uploads fail signature verification.
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      GLOBAL_S3_BUCKET: mike
      TENANT_ID: mike
      REGION: auto
      FILE_SIZE_LIMIT: "52428800"
      ENABLE_IMAGE_TRANSFORMATION: "false"
      S3_PROTOCOL_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Run configure.py first}
      S3_PROTOCOL_ACCESS_KEY_SECRET: ${S3_SECRET_KEY:?Run configure.py first}
    volumes:
      - documents:/var/lib/storage
    healthcheck:
      test: [CMD, wget, --spider, -q, http://127.0.0.1:5000/status]
      interval: 10s
      timeout: 5s
      retries: 30

  db-init:
    image: supabase/postgres:17.6.1.136
    restart: "no"
    depends_on:
      auth: {condition: service_healthy}
      storage: {condition: service_healthy}
    environment:
      PGHOST: db
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ../../apps/mike/backend/schema.sql:/schema.sql:ro
      - ./init-db.sh:/init-db.sh:ro
    entrypoint: [/bin/sh, /init-db.sh]

  backend:
    <<: *service
    build: ../../apps/mike/backend
    depends_on:
      db-init: {condition: service_completed_successfully}
    env_file: .env.backend
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      NODE_ENV: production
      PORT: "3001"
      FRONTEND_URL: ${PUBLIC_URL}
      MIKE_PUBLIC_API_BASE_URL: ${PUBLIC_URL}/backend
      SUPABASE_URL: http://gateway:8081
      SUPABASE_SECRET_KEY: ${SERVICE_ROLE_KEY}
      R2_ENDPOINT_URL: http://storage:5000/s3
      R2_PUBLIC_ENDPOINT_URL: ${PUBLIC_URL}/supabase/storage/v1/s3
      R2_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      R2_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      R2_BUCKET_NAME: mike
      DOWNLOAD_SIGNING_SECRET: ${DOWNLOAD_SIGNING_SECRET:?Run configure.py first}
      USER_API_KEYS_ENCRYPTION_SECRET: ${USER_API_KEYS_ENCRYPTION_SECRET:?Run configure.py first}

  frontend:
    <<: *service
    build:
      context: ../../apps/mike/frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${PUBLIC_URL}/supabase
        NEXT_PUBLIC_SUPABASE_PROXY_PATH: /supabase
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${ANON_KEY}
        NEXT_PUBLIC_API_BASE_URL: /backend
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_URL}
        NEXT_PUBLIC_DISABLE_SIGNUP: "true"

  gateway:
    <<: *service
    image: caddy:2.10-alpine
    ports:
      - 127.0.0.1:${MIKE_PORT:-3052}:8080
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      auth: {condition: service_healthy}
      rest: {condition: service_healthy}
      storage: {condition: service_healthy}
      frontend: {condition: service_healthy}
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, --spider, -q, http://127.0.0.1:8080/ready]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  database:
  database-config:
  documents:
